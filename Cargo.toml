[package]
name = "gaslighting-compiler"
version = "0.1.0"
edition = "2021"
authors = ["Gaslighting Compiler Contributors"]
description = "A fake compiler that gaslights the user"
repository = "https://github.com/yourusername/gaslighting-compiler"
keywords = ["compiler", "gaslighting", "cli", "humor", "fake"]
categories = ["command-line-utilities", "development-tools"]
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
chrono = "0.4"

[[bin]]
name = "gaslighting-compiler"
path = "src/main.rs"
